# Azure DevOps pipeline: runs every test level on each push and pull request,
# and publishes results (Tests tab) and code coverage (Code Coverage tab).
trigger:
  branches:
    include: ['*']
pr:
  branches:
    include: ['*']

pool:
  vmImage: ubuntu-24.04

variables:
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip

stages:
  - stage: test
    displayName: Test
    jobs:
      - job: unit_and_api
        displayName: Algorithm, game rules and API
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.12' }
          - script: pip install -e . -r webapp/requirements-dev.txt
            displayName: Install
          - script: |
              python -m pytest tests \
                --junitxml=results/core.xml \
                --cov=cbba --cov-report=xml:results/coverage-core.xml
            displayName: Unit and integration tests (cbba core)
          - script: |
              cd webapp && python -m pytest tests --ignore=tests/e2e \
                --junitxml=../results/webapp.xml \
                --cov=app --cov-report=xml:../results/coverage-webapp.xml
            displayName: Game rules and API tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: results/*.xml
              testRunTitle: Unit, integration and API
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: results/coverage-*.xml

      - job: e2e
        displayName: End-to-end (browser)
        dependsOn: unit_and_api
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.12' }
          - script: |
              pip install -e . -r webapp/requirements-dev.txt
              playwright install --with-deps chromium
            displayName: Install app and browser
          - script: |
              cd webapp && python -m pytest tests/e2e \
                --junitxml=../results/e2e.xml \
                --tracing=retain-on-failure --output=../results/traces
            displayName: Playwright end-to-end tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: results/e2e.xml
              testRunTitle: End-to-end
          - publish: results/traces
            artifact: playwright-traces
            condition: failed()
            displayName: Keep browser traces of failed tests
