[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbba"
version = "0.1.0"
description = "Consensus-Based Bundle Algorithm (Choi, Brunet & How, 2009): decentralized multi-agent task allocation"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["cbba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
